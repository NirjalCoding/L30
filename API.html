<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Validation API in JavaScript</h1>
    <input id="id1" type="number" min="100" max="300" required>
    <button onclick="myFunction()">Ok!</button>
    <p>If the number if less than 100 or more than 300, error message will be displayed.</p>
    <p id="result"></p>
    <script>
        function myFunction() {
            var inpObj = document.getElementById("id1");
            if (!inpObj.checkValidity()) {
                document.getElementById("result").innerHTML = inpObj.validationMessage;
            } else {
                document.getElementById("result").innerHTML = "Input ok";
            }
        }
    </script>
</body>
</html>
